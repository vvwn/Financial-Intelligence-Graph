# FIG 开发环境 —— PostgreSQL 16 + Neo4j 5
#
# 用法：
#   cp .env.example .env          # 填写密码
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps
#
# 数据卷：fig_pgdata / fig_neo4jdata（重启不丢数据）

name: fig

services:
  postgres:
    image: postgres:16-alpine
    container_name: fig-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fig}
      POSTGRES_USER: ${POSTGRES_USER:-fig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # 中文排序与大小写不敏感比较，为后续实体名匹配做准备
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Bind to loopback only: a dev database must not be reachable from the LAN.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fig_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fig} -d ${POSTGRES_DB:-fig}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  neo4j:
    image: neo4j:5.26-community
    container_name: fig-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - fig_neo4jdata:/data
      - fig_neo4jlogs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # 完整栈（可选）：docker compose --profile full up -d
  # 默认不构建，日常开发把 api 跑在宿主机更快。
  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: fig-api:0.1.1
    container_name: fig-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fig}
      POSTGRES_USER: ${POSTGRES_USER:-fig}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}
      NEO4J_DATABASE: neo4j
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

volumes:
  fig_pgdata:
  fig_neo4jdata:
  fig_neo4jlogs:
