[project]
name = "fig-backend"
version = "0.1.0"
description = "Financial Intelligence Graph - backend (modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "greenlet>=3.1,<4.0",
    "neo4j>=5.26,<6.0",
    "apscheduler>=3.10,<4.0",
    "httpx>=0.27,<1.0",
    "tenacity>=9.0,<10.0",
    "python-multipart>=0.0.12",
    "pypinyin>=0.55.0",
    "baostock>=0.9.4",
    "pypdf>=7.1.0",
    "tushare>=1.4.29",
    "six>=1.17.0",
    "pdfplumber>=0.11.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "respx>=0.21,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.uv]
package = false

# pytest / ruff / mypy config lives in the repo-root pyproject.toml so that one
# command covers both backend/tests and tests/ at the repo root.
