    announcement_title: 关于控股子公司海太半导体拟与SK海力士签署《第四期后工序服务合同》暨关联交易的公告
    announcement_date: "2025-06-19"
    source_url: http://static.cninfo.com.cn/finalpage/2025-06-19/1223910508.PDF
    evidence_grade: A
    excerpt: >-
      海太半导体与SK海力士于2009年11月27日、2015年4月29日和2020年6月30日就后工序服务的合作事宜，
      先后签署了《后工序服务合同》《第二期后工序服务合同》《第三期后工序服务合同》，
      由海太半导体向SK海力士提供半导体后工序服务。双方拟就半导体后工序服务合作事宜签署四期合同，
      明确海太半导体在未来5年（2025年7月1日至2030年6月30日）继续以“全部成本+约定收益”的盈利模式
      向SK海力士提供半导体后工序服务。SK海力士为公司子公司海太半导体第二大股东（持股45%），
      是公司关联人。公司持有海太半导体55%股权。

