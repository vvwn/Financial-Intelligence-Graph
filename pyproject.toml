[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["database/migrations/versions", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # FastAPI's dependency-injection idiom is Depends() in the signature default.
    "B008",
    # Envelope uses typing.Generic so it works with response_model in this pydantic version.
    "UP046",
]

[tool.pytest.ini_options]
# One test root for the whole repo. Previously testpaths pointed at backend/tests
# only, so tests/fixtures and tests/acceptance at the repo root were never collected.
testpaths = ["backend/tests", "tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live PostgreSQL (docker compose up -d postgres)",
    "neo4j: requires a live Neo4j (docker compose up -d neo4j)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
